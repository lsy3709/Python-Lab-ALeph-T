<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>부산 테마여행 목록</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- ※ 직접 CSS 의 .container·body·h2 규칙은 Tailwind(.container 유틸리티·preflight 리셋)에
         덮여 깨진다 → 다른 화면과 같이 Tailwind 클래스로만 꾸민다. -->
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">
    {% include 'partials/_nav.html' %}
    <main class="max-w-4xl mx-auto px-4 py-6 flex-1 w-full">
        <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100">
            <h2 class="text-lg font-bold mb-2">부산 테마여행 목록 (최대 100건)</h2>
            <div id="loading" class="text-sm text-gray-400 py-6 text-center">데이터를 불러오는 중입니다...</div>
            <div id="postListContainer" class="divide-y divide-gray-100"></div>
        </div>
    </main>

    <script>
        async function fetchPublicPosts() {
            try {
                const response = await fetch('/api/public/posts');
                const data = await response.json();
                
                // 참고 데이터 포맷 구조 파싱 (getRecommendedKr -> item 배열)
                const items = data.getRecommendedKr?.item || [];
                
                const container = document.getElementById('postListContainer');
                document.getElementById('loading').style.display = 'none';

                if (items.length === 0) {
                    container.innerHTML = '<p class="text-center text-gray-400 py-6">조회된 데이터가 없습니다. 인증키를 확인해주세요.</p>';
                    return;
                }

                items.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'flex items-center gap-4 py-4 px-2 cursor-pointer rounded-lg hover:bg-gray-50 transition';
                    // 클릭 시 고유 번호(UC_SEQ)를 이용해 상세 페이지로 이동
                    card.onclick = () => {
                        window.location.href = `/public-posts/${item.UC_SEQ}`;
                    };

                    card.innerHTML = `
                        <img src="${item.MAIN_IMG_THUMB || ''}" alt="썸네일" class="w-24 h-[72px] shrink-0 object-cover rounded bg-gray-200" onerror="this.src='https://via.placeholder.com/100x75?text=No+Image'">
                        <div class="min-w-0 flex-1">
                            <h3 class="font-semibold text-gray-800 mb-1">${item.TITLE || '제목 없음'}</h3>
                            <p class="text-sm text-gray-500 line-clamp-2">${item.ITEMCNTNTS ? item.ITEMCNTNTS.replace(/<[^>]*>?/gm, '') : '설명이 없습니다.'}</p>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                document.getElementById('loading').innerText = '데이터를 불러오는 중 오류가 발생했습니다.';
                console.error(error);
            }
        }

        fetchPublicPosts();
    </script>
</body>
</html>
