# ============================================================================
# keepalived-sub.conf — SUB(BACKUP) 노드 설정
# ----------------------------------------------------------------------------
# main 과 거의 동일하고 "역할/우선순위/주소" 만 다르다:
#   state=BACKUP · priority=100(main 150 보다 낮음) · unicast 주소가 반대.
# 평소엔 VIP 를 안 가진다(대기). main 이 죽거나 main 게시판이 죽어 main priority 가
#   90(=150-60)으로 떨어지면 → 100 > 90 이 되어 sub 가 MASTER 로 승격, VIP 를 넘겨받는다.
# 이 컨테이너는 board-sub 네트워크 공유(eth0=172.16.0.12).
# ============================================================================

global_defs {
    enable_script_security
    script_user root
}

# health check 블록은 main 과 동일(각 노드가 자기 게시판을 점검).
vrrp_script chk_board {
    script "/check.sh"
    interval 2
    fall 2
    rise 2
    weight -60
}

vrrp_instance VI_1 {
    state BACKUP            # 초기 역할 = 대기
    interface eth0
    virtual_router_id 51    # ★ main 과 "같은" 그룹 번호여야 짝이 됨
    priority 100            # main(150)보다 낮음 → 평소 VIP 안 가짐. main 실패(→90) 시 100>90 이라 승격
    advert_int 1

    unicast_src_ip 172.16.0.12   # 내(=sub) 주소
    unicast_peer {
        172.16.0.11              # 상대(=main) 주소
    }

    virtual_ipaddress {
        172.16.0.100/24          # 같은 VIP(인계 대상)
    }

    track_script {
        chk_board
    }
}
