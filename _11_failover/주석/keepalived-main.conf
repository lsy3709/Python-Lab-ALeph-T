# ============================================================================
# keepalived-main.conf — MAIN(MASTER) 노드 설정
# ----------------------------------------------------------------------------
# 개념: 두 노드(main/sub)가 VRRP 로 "나 살아있다" 광고를 주고받는다.
#   priority(우선순위)가 높은 쪽이 VIP(가상 IP 172.16.0.100)를 가져간다.
#   평소 main(150) > sub(100) → main 이 VIP 보유. main 이 죽거나 게시판이 죽으면
#   priority 가 떨어져 sub(100)가 더 높아지고 → sub 로 VIP 가 넘어간다(failover).
# 이 컨테이너는 board-main 의 네트워크를 공유(eth0=172.16.0.11)하므로 VIP 가 게시판에 붙는다.
# ============================================================================

global_defs {
    enable_script_security   # 아래 외부 스크립트(/check.sh) 실행 시 보안 검사(소유자/권한 확인)
    script_user root         # 스크립트를 root 로 실행
}

# vrrp_script: "이 노드의 게시판이 살아있나" 를 주기적으로 점검하는 블록.
vrrp_script chk_board {
    script "/check.sh"   # 게시판 200 이면 성공(0), 아니면 실패 — Dockerfile.keepalived 가 만든 파일
    interval 2           # 2초마다 점검
    fall 2               # 2회 연속 실패 → '비정상' 으로 판정
    rise 2               # 2회 연속 성공 → '정상' 복귀
    weight -60           # 비정상이면 priority 를 60 깎음 (150-60=90). 90 < sub 100 → sub 로 VIP 인계
}

# vrrp_instance: 실제 VIP 를 관리하는 그룹 하나.
vrrp_instance VI_1 {
    state MASTER             # 초기 역할 표시(진짜 소유자는 priority 비교로 정해짐)
    interface eth0          # VIP 를 붙일 네트워크 인터페이스
    virtual_router_id 51    # VRRP 그룹 번호 — main/sub 가 "같은 숫자" 여야 한 짝으로 묶인다
    priority 150            # 우선순위(높을수록 VIP 우선). 평소 main 이 보유
    advert_int 1            # 1초마다 "나 살아있다" VRRP 광고 전송

    # ★ 멀티캐스트 대신 unicast: WSL2/도커 환경은 VRRP 멀티캐스트(224.0.0.18)가 막혀
    #   상대 IP 를 직접 지정하는 unicast 로 통신한다.
    unicast_src_ip 172.16.0.11   # 내(=main) 주소
    unicast_peer {
        172.16.0.12              # 상대(=sub) 주소
    }

    virtual_ipaddress {
        172.16.0.100/24          # 공유 VIP — 학생은 항상 이 주소(:5000)로 접속
    }

    track_script {
        chk_board                # 위 health check 결과를 priority 에 연동(실패→-60)
    }
}
