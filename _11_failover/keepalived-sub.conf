# keepalived SUB(BACKUP) — 평소 대기, main 이 죽으면(또는 health check 실패로 priority 하락) VIP 를 넘겨받는다.
# board-sub 와 netns 공유(eth0=172.16.0.12). main 과 차이는 state/priority/주소뿐(나머지 동일).
global_defs {
    enable_script_security
    script_user root
}
vrrp_script chk_board {
    script "/check.sh"
    interval 2
    fall 2
    rise 2
    weight -60
}
vrrp_instance VI_1 {
    state BACKUP            # 초기 역할=대기
    interface eth0
    virtual_router_id 51    # main 과 같은 그룹
    priority 100            # main(150)보다 낮음 → 평소엔 VIP 안 가짐. main 실패로 90 이 되면 100>90 이라 승격
    advert_int 1
    unicast_src_ip 172.16.0.12
    unicast_peer {
        172.16.0.11         # 상대(main) 주소
    }
    virtual_ipaddress {
        172.16.0.100/24     # 같은 VIP(인계 대상)
    }
    track_script {
        chk_board
    }
}
