# keepalived MAIN(MASTER) — 평소 VIP(172.16.0.100)를 소유한다. board-main 과 netns 공유(eth0=172.16.0.11).
global_defs {
    enable_script_security   # 외부 스크립트 실행 시 보안 검사(root 소유·쓰기권한 제한)
    script_user root
}
# 게시판 생존 점검: /check.sh 를 2초마다 실행, 2회 연속 실패하면 priority 를 60 깎는다.
vrrp_script chk_board {
    script "/check.sh"
    interval 2          # 점검 주기(초)
    fall 2              # 2회 연속 실패 → 비정상 판정
    rise 2              # 2회 연속 성공 → 정상 복귀
    weight -60          # 실패 시 priority -60 (150-60=90 < sub 100 → sub 로 VIP 인계)
}
vrrp_instance VI_1 {
    state MASTER            # 초기 역할(실제 소유는 priority 비교로 결정)
    interface eth0
    virtual_router_id 51    # 같은 VRRP 그룹(main/sub 동일해야 짝이 됨)
    priority 150            # 높을수록 우선 → 평소 main 이 VIP 보유
    advert_int 1            # VRRP 광고 간격(초)
    # WSL2/도커에선 멀티캐스트 VRRP 가 막혀 unicast(상대 IP 지정)로 통신
    unicast_src_ip 172.16.0.11
    unicast_peer {
        172.16.0.12         # 상대(sub) 주소
    }
    virtual_ipaddress {
        172.16.0.100/24     # 공유 VIP — 학생은 항상 이 주소로 접속
    }
    track_script {
        chk_board           # 위 health check 를 priority 에 연동
    }
}
